{% extends "base.html" %}

{% block title %}Apply | HireFlow{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="fw-bold">
                        Apply for {{ job.title }}
                    </h2>

                    <p class="text-muted">
                        {{ job.company }}
                    </p>

                    <hr>

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Submit Application
                        </button>

                        <a
                            href="{% url 'job_detail' job.id %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
