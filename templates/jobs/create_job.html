{% extends "base.html" %}

{% block title %}
Post a Job | HireFlow
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">
                        Post a New Job
                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Job Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="e.g. Python Developer"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Company
                            </label>

                            <input
                                type="text"
                                name="company"
                                class="form-control"
                                placeholder="e.g. ABC Technologies"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                placeholder="e.g. Kochi / Remote"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Salary
                            </label>

                            <input
                                type="number"
                                name="salary"
                                class="form-control"
                                placeholder="e.g. 600000"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Job Type
                            </label>

                            <select
                                name="job_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Job Type
                                </option>

                                <option value="Full Time">
                                    Full Time
                                </option>

                                <option value="Part Time">
                                    Part Time
                                </option>

                                <option value="Internship">
                                    Internship
                                </option>

                                <option value="Contract">
                                    Contract
                                </option>

                                <option value="Remote">
                                    Remote
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Skills
                            </label>

                            <input
                                type="text"
                                name="skills"
                                class="form-control"
                                placeholder="Python, Django, MySQL, REST API"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Requirements
                            </label>

                            <textarea
                                name="requirements"
                                class="form-control"
                                rows="5"
                                placeholder="Enter job requirements..."
                                required
                            ></textarea>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Job Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="6"
                                placeholder="Describe the job..."
                                required
                            ></textarea>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Post Job
                            </button>

                            <a
                                href="{% url 'dashboard' %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
