{% extends "base.html" %}

{% block title %}
Edit Job | HireFlow
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">
                        Edit Job
                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Job Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                value="{{ job.title }}"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Company
                            </label>

                            <input
                                type="text"
                                name="company"
                                value="{{ job.company }}"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                value="{{ job.location }}"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Salary
                            </label>

                            <input
                                type="number"
                                name="salary"
                                value="{{ job.salary }}"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Job Type
                            </label>

                            <select
                                name="job_type"
                                class="form-select"
                                required
                            >

                                <option value="Full Time"
                                    {% if job.job_type == "Full Time" %}selected{% endif %}>
                                    Full Time
                                </option>

                                <option value="Part Time"
                                    {% if job.job_type == "Part Time" %}selected{% endif %}>
                                    Part Time
                                </option>

                                <option value="Internship"
                                    {% if job.job_type == "Internship" %}selected{% endif %}>
                                    Internship
                                </option>

                                <option value="Contract"
                                    {% if job.job_type == "Contract" %}selected{% endif %}>
                                    Contract
                                </option>

                                <option value="Remote"
                                    {% if job.job_type == "Remote" %}selected{% endif %}>
                                    Remote
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Skills
                            </label>

                            <input
                                type="text"
                                name="skills"
                                value="{{ job.skills }}"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Requirements
                            </label>

                            <textarea
                                name="requirements"
                                class="form-control"
                                rows="5"
                                required
                            >{{ job.requirements }}</textarea>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="6"
                                required
                            >{{ job.description }}</textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{% url 'my_jobs' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
